name: Soroban Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run tests
        run: cd contracts && cargo test

      - name: Run clippy
        run: cd contracts && cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cd contracts && cargo fmt --workspace --check

  coverage:
    name: Contract Test Coverage (tarpaulin ≥85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install cargo-tarpaulin
        # Closes #1495, #1496: measure unit test coverage for escrow, treasury,
        # and fee-manager and enforce the ≥85% threshold required by those issues.
        run: cargo install cargo-tarpaulin --locked

      - name: Measure coverage (escrow)
        run: |
          cd contracts
          cargo tarpaulin \
            --packages escrow \
            --out Xml \
            --output-dir tarpaulin-escrow \
            --fail-under 85 \
            --timeout 120

      - name: Measure coverage (treasury)
        run: |
          cd contracts
          cargo tarpaulin \
            --packages treasury \
            --out Xml \
            --output-dir tarpaulin-treasury \
            --fail-under 85 \
            --timeout 120

      - name: Measure coverage (fee-manager)
        run: |
          cd contracts
          cargo tarpaulin \
            --packages fee-manager \
            --out Xml \
            --output-dir tarpaulin-fee-manager \
            --fail-under 85 \
            --timeout 120

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-coverage-${{ github.sha }}
          path: |
            contracts/tarpaulin-escrow/
            contracts/tarpaulin-treasury/
            contracts/tarpaulin-fee-manager/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build optimized WASM
        run: cd contracts && cargo build --target wasm32-unknown-unknown --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v3
        with:
          name: wasm-artifacts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
