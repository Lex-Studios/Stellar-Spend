[package]
name = "scavenger"
version.workspace = true
edition.workspace = true

[dependencies]
soroban-sdk = { workspace = true }
stellar-spend-shared = { workspace = true }

[dev-dependencies]
# Self-dependency with `testutils` on, so `tests/` can reach `scavenger::test_utils`.
scavenger = { path = ".", features = ["testutils"] }
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "pause"
path = "tests/pause.rs"

[[test]]
name = "unauthorized"
path = "tests/unauthorized.rs"
